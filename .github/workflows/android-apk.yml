name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Flutter Android project
        run: |
          flutter create --platforms=android --org com.kalorivision --project-name kalorivision_ai /tmp/kv_build
          cp pubspec.yaml /tmp/kv_build/pubspec.yaml
          rm -rf /tmp/kv_build/lib
          cp -R lib /tmp/kv_build/lib
          cd /tmp/kv_build
          flutter pub get
      - name: Build release APK
        run: |
          cd /tmp/kv_build
          flutter build apk --release
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 /tmp/kv_build/build/app/outputs/flutter-apk/app-release.apk --title "KaloriVision AI 1.0.1" --notes "🥳 KaloriVision AI 1.0.1 hazır." || gh release upload v1.0.1 /tmp/kv_build/build/app/outputs/flutter-apk/app-release.apk --clobber
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaloriVision-AI-APK
          path: /tmp/kv_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
